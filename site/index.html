<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Social Topics</title>
  <meta name="description" content="Topics people are talking about on YouTube, X, Facebook and Instagram.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%233b5bdb%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <div>
        <h1>Social Topics</h1>
        <p class="sub">What people are talking about on YouTube, X, Facebook and Instagram</p>
      </div>
      <label class="picker">
        <span>Scan</span>
        <select id="report-select" aria-label="Choose a scan"></select>
      </label>
    </div>
  </header>

  <main class="wrap" id="app">
    <p class="muted">Loading…</p>
  </main>

  <footer class="wrap foot">
    Generated by <a href="https://github.com/Inasjackw321/Social-media-analysis">social-topics</a>.
    Topics are keyphrases that show up in posts from several accounts, ranked by engagement and how many platforms they appear on.
  </footer>

  <script src="app.js"></script>
</body>
</html>
