name: Scan from request file

# Commit a changed scan-request.json on any branch to run a scan without the
# Actions "Run workflow" button. The report is committed back to that branch;
# on main, the Pages site is redeployed too.
on:
  push:
    paths: ["scan-request.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: social-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Scrapling and its browser
        run: pip install -r requirements.txt && scrapling install

      - name: Restore Scrapling's adaptive-selector memory
        uses: actions/cache@v4
        with:
          path: .scrapling
          key: scrapling-adaptive-${{ github.run_id }}
          restore-keys: scrapling-adaptive-

      - name: Scan
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          INSTAGRAM_SESSIONID: ${{ secrets.INSTAGRAM_SESSIONID }}
          FACEBOOK_COOKIES: ${{ secrets.FACEBOOK_COOKIES }}
        run: python -m social_topics scan --request scan-request.json --report-id "run-${{ github.run_id }}"

      - name: Save report to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git commit -m "Scan results from scan-request.json (run ${{ github.run_id }})"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break
            sleep 5
          done

      - if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: scan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
